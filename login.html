<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio Sesión - Sonido Vivo</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Sonido Vivo</h1>
      <nav>
        <a href="index.html">Inicio</a> |
        <a href="productos.html">Productos</a> |
        <a href="nosotros.html">Nosotros</a> | <a href="blogs.html">Blog</a> |
        <a href="carrito.html">Carrito</a>
      </nav>
    </header>
    <main>
      <section id="iniSecion">
        <h2>Iniciar sesión</h2>
        <form id="formInicioSesion" novalidate>
          <label for="correo">Correo</label>
          <input
            type="email"
            id="correo"
            name="correo"
            maxlength="100"
            required
          />
          <span class="mensaje-error" id="error-correo"></span>
          <label for="contrasena">Contraseña</label>
          <input
            type="password"
            id="contrasena"
            name="contrasena"
            minlength="4"
            maxlength="10"
            required
          />
          <span class="mensaje-error" id="error-contrasena"></span>
          <button type="submit" id="btnInicioSesion">Iniciar sesión</button>
        </form>
      </section>
      <section>
        <p>¿No posees un usuario?</p>
        <a href="registro.html">Registrate</a>
      </section>
    </main>
    <footer></footer>
    <script src="js/validaciones.js"></script>
  </body>
</html>
