  <main>
    <h2>Registro de Usuario</h2>

<form id="usuarioForm" novalidate>
  
  <!-- RUN -->
  <div class="mb-3">
    <label for="runInput" class="form-label">RUN</label>
    <input 
      type="text" 
      class="form-control" 
      id="runInput" 
      placeholder="Ej: 19011022K"
      maxlength="9" 
      required
    >
  </div>

  <!-- Nombre -->
  <div class="mb-3">
    <label for="nombreInput" class="form-label">Nombre</label>
    <input 
      type="text" 
      class="form-control" 
      id="nombreInput" 
      maxlength="50" 
      required
    >
  </div>

  <!-- Apellidos -->
  <div class="mb-3">
    <label for="apellidosInput" class="form-label">Apellidos</label>
    <input 
      type="text" 
      class="form-control" 
      id="apellidosInput" 
      maxlength="100" 
      required
    >
  </div>

  <!-- Correo -->
  <div class="mb-3">
    <label for="correoInput" class="form-label">Correo</label>
    <input 
      type="email" 
      class="form-control" 
      id="correoInput" 
      placeholder="nombre@ejemplo.cl" 
      maxlength="100" 
      required
    >
  </div>

  <!-- Contraseña -->
  <div class="mb-3">
    <label for="passwordInput" class="form-label">Contraseña</label>
    <input 
      type="password" 
      class="form-control" 
      id="passwordInput" 
      placeholder="Entre 4 y 10 caracteres"
      minlength="4"
      maxlength="10" 
      required
    >
  </div>

  <!-- Fecha Nacimiento -->
  <div class="mb-3">
    <label for="fechaNacimientoInput" class="form-label">Fecha Nacimiento (opcional)</label>
    <input 
      type="date" 
      class="form-control" 
      id="fechaNacimientoInput"
    >
  </div>

  <!-- Tipo de Usuario -->
  <div class="mb-3">
    <label for="tipoUsuarioSelect" class="form-label">Tipo de Usuario</label>
    <select class="form-select" id="tipoUsuarioSelect">
      <option value="" selected disabled>Seleccione un tipo...</option>
      <option value="Administrador">Administrador</option>
      <option value="Cliente">Cliente</option>
      <option value="Vendedor">Vendedor</option>
    </select>
  </div>

  <!-- Región -->
  <div class="mb-3">
    <label for="regionSelect" class="form-label">Región</label>
    <select class="form-select" id="regionSelect">
      <option value="" selected disabled>Seleccione una región...</option>
    </select>
  </div>

  <!-- Comuna -->
  <div class="mb-3">
    <label for="comunaSelect" class="form-label">Comuna</label>
    <select class="form-select" id="comunaSelect">
      <option value="" selected disabled>Seleccione una comuna...</option>
    </select>
  </div>

  <!-- Dirección -->
  <div class="mb-3">
    <label for="direccionInput" class="form-label">Dirección</label>
    <input 
      type="text" 
      class="form-control" 
      id="direccionInput" 
      maxlength="300" 
      required
    >
  </div>

  <button type="submit" class="btn btn-primary">Guardar</button>
</form>

    <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
  </main>

</body>
